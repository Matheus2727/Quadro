<!DOCTYPE html>
<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="d-flex flex-column">
        <div style="width: 100%;background-color: rgb(207, 205, 205); border-bottom: 1px solid black;">
            <h3 style="margin:10px">Quadro - Configurações</h3>
        </div>

        <main style="width: 300px;margin: 0 auto; margin-top: 30px;border: 1px solid black; border-radius: 15px;">
            <div style="margin: 10px">
                <h4>Configurações:</h4>
                <form method="POST" action="/atualizarConfigs">
                    <label class="form-label">Tempo:</label>
                    <input class="form-control" name="Tempo" value="{{ tempo }}">
                    <label class="form-label">Formato:</label>
                    <input class="form-control" value="a">
                    <button class="btn btn-success mt-3">Salvar Configurações</button>
                </form>
                <hr>
                <h4>Comandos:</h4>
                <form method="GET" action="/login">
                    <button class="btn btn-success my-2">Adicionar Fotos</button>
                </form>
                <form action="/editTagsFotos" method="GET">
                    <button class="btn btn-primary my-2">Editar Registro</button>
                </form>
                <button id="abrir_popup_Tags" class="btn btn-primary my-2 abrirPopup abrir_popup_Tags">Tags Desejadas</button>
                <form action="/photos">
                    <button class="btn btn-secondary mt-2">Fotos</button>
                </form>
            </div>
        </main>
    </div>


    <div id="popup_Tags" class="popup-overlay">
        <div class="popup d-flex flex-column" style="width: 90%; height: 80%; overflow:hidden">
            <h3 class="">Tags Desejadas</h3>
            <div class="tab-content" id="manipulacaoTabContent" style="height:80%;animation: fadeIn 0.3s ease;
            overflow-y: scroll;">
                {% for vt in valores_tags %}
                <div>
                <input id="inputCat_{{ vt['t'] }}" type="hidden" name="{{ vt['t'] }}" value="{{ vt['v'] }}" form="form_apply_tags">
                {% if vt['v'] == 1 %}
                <button id="btnCat_{{ vt['t'] }}" class="btn btnCat on my-1 btn-tag">{{ vt['t'] }}</button>
                {% else %}
                <button id="btnCat_{{ vt['t'] }}" class="btn btnCat off my-1 btn-tag">{{ vt['t'] }}</button>
                {% endif %}
                </div>
                {% endfor %}
                <form id="form_apply_tags" method="post" action="/applyTags">
                    <button class="btn btn-success my-1" style="width: 150px">Aplicar</button>
                </form>
            </div>
            
        </div>
    </div>




    <script>
        const btnCats = [...document.getElementsByClassName("btnCat")];
        btnCats.forEach(e => {
            e.addEventListener("click", () => {
                let id = e.id;
                let inputCat = document.getElementById(id.replace("btnCat", "inputCat"));
                let value = inputCat.value;
                if (value == "1") {
                    inputCat.value = "0";
                    e.classList.remove("on");
                    e.classList.add("off");
                } else {
                    inputCat.value = "1";
                    e.classList.add("on");
                    e.classList.remove("off");
                };
            });
        });
    </script>

    <script>
        const popups = [...document.getElementsByClassName("popup-overlay")];
        const buttonsPopups = document.getElementsByClassName("abrirPopup");

        popups.forEach(popup => {
            let idPopup = popup.id;
            let idButtonPopup = "abrir_" + idPopup;
            let buttonsPopup = [...document.getElementsByClassName(idButtonPopup)];
            buttonsPopup.forEach(buttonPopup => {
                buttonPopup.addEventListener("click", () => {
                    console.log("aaaa")
                    popup.classList.add("ativo");
                });
            })

            popup.addEventListener("click", (e) => {
                if (e.target === popup) {
                    popup.classList.remove("ativo");
                }
            });
        });
    </script>

</body>

</html>
