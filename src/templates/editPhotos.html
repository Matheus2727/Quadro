<!DOCTYPE html>
<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <div class="d-flex flex-column" style="overflow-y:scroll">
        <div style="width: 100%;background-color: rgb(207, 205, 205); border-bottom: 1px solid black;
        position: relative;">
            <h3 style="margin:10px; width: 50%">Quadro - Edição Final</h3>
            <form action="/cancelar">
                <button class="btn btn-primary" style="position:absolute;right: 22px; top: 7px">M</button>
            </form>
        </div>

        <main style="margin: 10px; margin-top: 10px;border: 1px solid black; border-radius: 15px;">
            <div style="margin: 10px">
                <table border="1" class="table table-striped table-hover table-bordered" style="width: 100%;">
                    <tr>
                        <th>Imagem</th>
                        <th>Tags (Deletar Existente ou Adicionar Nova)</th>
                    </tr>
                    {% for pho in photos %}
                    <tr>
                        <td style="width:200px">
                            <img src="{{ url_for('static', filename='photos/' + pho['Nome_Photo']) }}"
                            style="width:200px;height:300px;object-fit:contain">
                        </td>
                        <td>
                            <div style="height:300px;overflow-y: scroll;overflow-x: hidden;">
                                <div style="position:relative; left: calc(50% - 75px);">
                                {% for t in pho['Tags'] %}
                                <div>
                                    <form method="post" action="/deleteTagOne">
                                        <input type="hidden" name="ID_Photo" value="{{ pho['ID_Photo'] }}">
                                        <input type="hidden" name="Tag" value="{{ t }}">
                                        <button class="btn btn-danger m-1 btn-tag">{{ t }}</button>
                                    </form>
                                </div>
                                    
                                    {% endfor %}
                                    <form method="post" action="/addTagOne">
                                        <input type="hidden" name="ID_Photo" value="{{ pho['ID_Photo'] }}">
                                        <div>   
                                            <input class="form-control m-1" style="width: 150px" name="Tag" placeholder="Nova Tag">
                                        </div>
                                        <div>
                                            <button class="btn btn-success m-1" style="width: 150px"> Add Tag</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
                
                
            </div>
        </main>
    </div>




</body>

</html>
